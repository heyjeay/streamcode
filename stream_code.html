<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Code</title>
<!--
  Stream Code overlay - shows the file you're editing in VS Code, clean, as an OBS browser source.
  Data comes from the "Stream Code" VS Code extension (stream_code/extension) over Server-Sent Events.

  Use as a browser source:   http://127.0.0.1:7331/            (served by the extension)
  Pick the look in VS Code:  settings -> Stream Code (theme, header, background, line numbers, wrap, size)
                             or http://127.0.0.1:7331/?gallery  (previews every theme, click to apply)

  URL options override the VS Code settings for one source:
                             ?theme=kick   any theme name from THEMES below
                             ?size=22      font size in px
                             ?lh=1.6       line height multiplier
                             ?wrap=0       don't word-wrap long lines (slide them sideways instead)
                             ?nums=0       hide line numbers
                             ?header=0     hide the file name bar
                             ?bg=0         no panel background: the code floats over the game
                             ?clean        header=0 + bg=0: just the code
                             ?fade=25      fade the code out over the top and bottom 25% (0 = hard edges)
                             ?tiltx=15 ?tilty=-25 ?rot=3      3D: tilt forward/back, turn left/right, rotate (degrees)
                             ?persp=1200 ?scale=0.9 ?depth=16 ?float=1 ?opacity=0.9
                             ?zoom=camera|lens  ?zoomfollow=both|mouse|cursor  ?zoomamt=1.8  ?zoomidle=5
                                           zoom in on what you point at (mouse) or edit (text cursor)
                             ?follow=0     with wrap off: don't slide long lines to keep the caret in view
                             ?demo         canned Lua that types itself, for positioning in OBS (&still = one frame)
                             ?backdrop     paint a game-like gradient behind the panel (for screenshots)
                             ?gallery      theme gallery / control panel
                             ?debug        green HUD with connection state
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Code:wght@400;500;600&family=VT323&family=Oswald:wght@500;600;700&family=Inter:wght@500;600;700&display=swap">
<style>
  :root {
    /* defaults = the Mocha theme; applyTheme() overwrites all of these */
    --panel: rgba(30, 30, 46, 0.93);
    --panel-solid: #1e1e2e;
    --edge: rgba(255, 255, 255, 0.07);
    --radius: 16px;
    --shadow: 0 16px 48px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.35);
    --head-bg: rgba(24, 24, 37, 0.85);
    --head-edge: rgba(255, 255, 255, 0.07);
    --head-font: 'Inter', system-ui, sans-serif;
    --head-size: 15px;
    --head-weight: 600;
    --head-transform: none;
    --head-spacing: 0;
    --head-text: #cdd6f4;
    --head-dim: #7f849c;
    --dot: #a6e3a1;
    --text: #cdd6f4;
    --nums: #6c7086;
    --nums-active: #b4befe;
    --curline: rgba(49, 50, 68, 0.55);
    --sel: rgba(88, 91, 112, 0.6);
    --caret: #f5e0dc;
    --caret-glow: rgba(245, 224, 220, 0.8);
    --accent: #b4befe;
    --accent2: #89b4fa;
    --accent-bg: rgba(180, 190, 254, 0.14);
    --accent-edge: rgba(180, 190, 254, 0.35);
    --mono: 'IBM Plex Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
    --text-shadow: none;
    --size: 22px;                 /* font size, from the look */
    --lh: 35px;                   /* computed: size * line height */
    --charw: 13px;                /* measured */
    --gutter-w: 64px;             /* computed from the line count */
    /* 3D look, from the settings */
    --tiltx: 0deg; --tilty: 0deg; --rot: 0deg; --persp: 1200px; --scale: 1; --opacity: 1; --depth: 0px;
    --fade: 4%;                   /* edge fade: share of the code area that fades at the top and at the bottom */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--mono); color: var(--text); }

  /* ===== 3D stage: tilt / turn / rotate / scale the whole panel ===== */
  body { perspective: var(--persp); perspective-origin: 50% 50%; }
  #stage {
    position: absolute; inset: 12px; transform-style: preserve-3d; opacity: var(--opacity);
    transform: rotateX(var(--tiltx)) rotateY(var(--tilty)) rotateZ(var(--rot)) scale(var(--scale));
    transition: transform .5s cubic-bezier(.2, .8, .2, 1), opacity .4s ease;
  }
  #float { position: absolute; inset: 0; transform-style: preserve-3d; }
  body.fx-float #float { animation: float 7s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translate3d(0, 0, 0) rotateY(0deg); } 50% { transform: translate3d(0, -10px, 0) rotateY(2deg); } }
  /* fake thickness: darker copies of the panel pushed back in z, visible at the edges when tilted */
  .slab { display: none; position: absolute; inset: 0; border-radius: var(--radius); background: var(--panel-solid); }
  body.fx-depth .slab { display: block; }
  body.no-bg .slab { display: none; }
  .slab.s1 { transform: translateZ(calc(var(--depth) * -0.34)); filter: brightness(.7); }
  .slab.s2 { transform: translateZ(calc(var(--depth) * -0.67)); filter: brightness(.5); }
  .slab.s3 { transform: translateZ(calc(var(--depth) * -1)); filter: brightness(.35); }
  #sheen {
    display: none; position: absolute; inset: 0; z-index: 6; pointer-events: none; border-radius: inherit;
    background: linear-gradient(115deg, rgba(255, 255, 255, .10) 0%, rgba(255, 255, 255, .03) 35%, rgba(255, 255, 255, 0) 60%);
  }
  body.fx-depth #sheen { display: block; }
  body.no-bg #sheen { display: none; }

  /* ===== the panel ===== */
  #panel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    opacity: 1; transform: translateY(0);
    transition: opacity .45s ease, transform .55s cubic-bezier(.16, 1, .3, 1);
  }
  #panel.hidden { opacity: 0; transform: translateY(24px); pointer-events: none; }

  /* ===== header ===== */
  #head {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px 11px;
    background: var(--head-bg);
    border-bottom: 1px solid var(--head-edge);
    font-family: var(--head-font); font-size: var(--head-size); font-weight: var(--head-weight);
    text-transform: var(--head-transform); letter-spacing: var(--head-spacing);
    color: var(--head-dim); white-space: nowrap; flex-shrink: 0;
    text-shadow: var(--text-shadow);
  }
  body.no-header #head { display: none; }
  #dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    background: var(--dot); box-shadow: 0 0 10px var(--dot);
    animation: pulse 1.6s ease-in-out infinite;
    transition: background .3s, box-shadow .3s;
  }
  #dot.off { background: var(--nums); box-shadow: none; animation: none; }
  #dot.demo { background: #f9e2af; box-shadow: 0 0 10px #f9e2af; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  #path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-weight: 500; font-size: calc(var(--head-size) + 1px); text-transform: none; letter-spacing: 0; }
  #dir { color: var(--head-dim); }
  #name { color: var(--head-text); font-weight: 600; }
  #dirty { display: none; color: var(--accent); font-size: 18px; line-height: 1; margin-left: -4px; }
  #dirty.on { display: inline; }
  #lang {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--accent); background: var(--accent-bg); border: 1px solid var(--accent-edge);
    padding: 3px 9px; border-radius: 999px;
  }
  #lang:empty { display: none; }
  #pos { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: none; color: var(--head-dim); font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; }

  /* header style: editor tab */
  body[data-head="tab"] #head { padding: 10px 14px 0; align-items: flex-end; gap: 10px; }
  body[data-head="tab"] #dot { margin-bottom: 14px; }
  body[data-head="tab"] #path { flex: 0 1 auto; max-width: 62%; padding: 8px 16px 9px; border-radius: 9px 9px 0 0; background: var(--panel-solid); border: 1px solid var(--edge); border-bottom: 0; }
  body[data-head="tab"] #lang { margin-left: auto; margin-bottom: 10px; }
  body[data-head="tab"] #pos, body[data-head="tab"] #dirty { margin-bottom: 10px; }

  /* header style: mac window */
  #tl { display: none; gap: 7px; align-items: center; flex-shrink: 0; }
  #tl i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  #tl i:nth-child(1) { background: #ff5f57; } #tl i:nth-child(2) { background: #febc2e; } #tl i:nth-child(3) { background: #28c840; }
  body[data-head="mac"] #tl { display: flex; }
  body[data-head="mac"] #dot { display: none; }
  body[data-head="mac"] #path { text-align: center; font-weight: 500; }
  body[data-head="mac"] #name { font-weight: 600; }

  /* ===== code view ===== */
  #view { position: relative; flex: 1; display: flex; min-height: 0; overflow: hidden; }
  #gutter, #code { position: relative; overflow: hidden; height: 100%; }

  /* ===== zoom: camera (the whole code view zooms and pans) or lens (a magnifier over the view) ===== */
  #zoom { position: absolute; inset: 0; display: flex; transform-origin: 0 0; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
  body.zoom-camera .inner, .zoom-clone .inner { will-change: auto; } /* re-raster at the zoomed size: crisp text */
  #lens {
    position: absolute; left: 0; top: 0; z-index: 7; display: none; overflow: hidden; pointer-events: none;
    border-radius: 14px; background: var(--panel-solid);
    border: 2px solid var(--accent2);
    box-shadow: 0 14px 40px rgba(0, 0, 0, .55), 0 0 0 1px rgba(0, 0, 0, .35), 0 0 24px var(--accent2-glow, transparent);
    opacity: 0;
    transition: transform .28s cubic-bezier(.2, .8, .2, 1), width .28s ease, height .28s ease, opacity .25s ease;
  }
  body.zoom-lens #lens { display: block; }
  #lens.on { opacity: 1; }
  #lens::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(160deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 38%); }
  #lens-content { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  .zoom-clone { position: absolute; inset: 0; display: flex; }
  #gutter { width: var(--gutter-w); flex-shrink: 0; }
  body.no-nums #gutter { width: 10px; }
  body.no-nums .ln { display: none; }
  #code { flex: 1; min-width: 0; }
  /* edge fade: the code dissolves at the top and bottom of the visible area (on #view, so it stays put while the camera zooms) */
  #view {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, rgba(0, 0, 0, .35) calc(var(--fade) * .45), #000 var(--fade),
                                        #000 calc(100% - var(--fade)), rgba(0, 0, 0, .35) calc(100% - var(--fade) * .45), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, rgba(0, 0, 0, .35) calc(var(--fade) * .45), #000 var(--fade),
                                        #000 calc(100% - var(--fade)), rgba(0, 0, 0, .35) calc(100% - var(--fade) * .45), transparent 100%);
  }
  body.no-fade #view { -webkit-mask-image: none; mask-image: none; }
  #code::after {
    content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 56px; pointer-events: none;
    background: linear-gradient(to right, transparent, var(--panel-solid));
    opacity: .92;
  }
  .inner {
    position: absolute; left: 0; top: 0; right: 0;
    will-change: transform;
    transition: transform .22s cubic-bezier(.2, .8, .2, 1);
  }
  #code-inner { right: auto; min-width: 100%; }
  body.no-anim .inner, body.no-anim #caret, body.no-anim .curline,
  body.no-anim #zoom, body.no-anim #lens, body.no-anim #lens-content { transition: none !important; }
  body.still #panel, body.still #stage, body.still #caret,
  body.still #zoom, body.still #lens, body.still #lens-content { transition: none !important; animation: none !important; }
  body.still #caret { opacity: 1; }
  body.backdrop { background: linear-gradient(135deg, #3a5a40 0%, #6b7f8f 45%, #b89a63 100%); }

  .line, .ln {
    position: absolute; left: 0; min-height: var(--lh); line-height: var(--lh);
    font-size: var(--size); white-space: pre; text-shadow: var(--text-shadow);
  }
  .line { padding-left: 14px; }
  .ln { right: 14px; text-align: right; color: var(--nums); font-variant-numeric: tabular-nums; transition: color .15s; }
  .ln.active { color: var(--nums-active); }
  .curline { position: absolute; left: 0; right: 0; height: var(--lh); background: var(--curline); transition: top .12s ease, height .12s ease; }
  #code-inner .curline { right: auto; width: 10000px; }
  .sel { position: absolute; background: var(--sel); border-radius: 3px; }
  .ref { position: absolute; width: 0; height: 0; pointer-events: none; }
  #caret {
    position: absolute; width: 2px;
    height: calc(var(--lh) * .78); margin-top: calc(var(--lh) * .11);
    background: var(--caret); box-shadow: 0 0 6px var(--caret-glow);
    transition: top .08s ease, left .06s ease;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* word wrap: lines take as many rows as they need, nothing overflows sideways */
  body.wrap #code-inner { right: 0; min-width: 0; }
  body.wrap #code-inner .curline { right: 0; width: auto; }
  body.wrap .line { right: 0; padding-right: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
  body.wrap #code::after { display: none; }

  /* bare mode: no panel, the code floats over the game with a soft shadow for legibility */
  body.no-bg { --text-shadow: var(--text-shadow-bare, 0 1px 2px rgba(0, 0, 0, .85), 0 0 10px rgba(0, 0, 0, .6)); }
  body.no-bg #panel { background: transparent; border-color: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  body.no-bg #head { background: transparent; border-bottom-color: transparent; }
  body.no-bg #code::after, body.no-bg #panel::before, body.no-bg #view::before, body.no-bg #view::after { display: none; }
  body.no-bg #lock { text-shadow: var(--text-shadow); }

  /* ===== theme effects ===== */
  body.fx-blur #panel { backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); }
  body.fx-topbar #panel::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; z-index: 3; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  body.fx-glow .hljs-keyword, body.fx-glow .hljs-string, body.fx-glow .hljs-number, body.fx-glow .hljs-title, body.fx-glow #name { text-shadow: 0 0 8px currentColor; }
  body.fx-glow #caret { box-shadow: 0 0 12px var(--caret-glow), 0 0 24px var(--caret-glow); }
  body.fx-scanlines #view::after { content: ''; position: absolute; inset: 0; z-index: 5; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 2px, transparent 2px 4px); }
  body.fx-scanlines #view::before { content: ''; position: absolute; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .35)); }
  body.fx-block-caret #caret { width: var(--charw); height: var(--lh); margin-top: 0; opacity: .5; box-shadow: none; }
  body.fx-square .sel { border-radius: 0; }

  /* private file card */
  #lock {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase; color: var(--head-dim);
  }
  #lock svg { width: 44px; height: 44px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
  #view.locked #lock { display: flex; }
  #view.locked #gutter, #view.locked #code { visibility: hidden; }

  /* ===== syntax colours (highlight.js classes -> theme variables) ===== */
  .hljs-comment, .hljs-quote { color: var(--syn-comment); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-doctag { color: var(--syn-keyword); }
  .hljs-literal, .hljs-number { color: var(--syn-number); }
  .hljs-string, .hljs-meta .hljs-string, .hljs-addition { color: var(--syn-string); }
  .hljs-built_in { color: var(--syn-builtin); }
  .hljs-title, .hljs-title.function_, .hljs-title.function_.invoke__, .hljs-section { color: var(--syn-function); }
  .hljs-title.class_, .hljs-title.class_.inherited__, .hljs-type { color: var(--syn-type); }
  .hljs-attr, .hljs-attribute { color: var(--syn-attr); }
  .hljs-property { color: var(--syn-property); }
  .hljs-variable, .hljs-template-variable { color: var(--syn-variable); }
  .hljs-variable.language_ { color: var(--syn-self); }
  .hljs-variable.constant_ { color: var(--syn-number); }
  .hljs-params { color: var(--syn-param); font-style: italic; }
  .hljs-operator { color: var(--syn-operator); }
  .hljs-punctuation { color: var(--syn-punct); }
  .hljs-meta, .hljs-meta .hljs-keyword { color: var(--syn-meta); }
  .hljs-tag { color: var(--syn-punct); }
  .hljs-tag .hljs-name, .hljs-name { color: var(--syn-tag); }
  .hljs-tag .hljs-attr { color: var(--syn-attr); }
  .hljs-selector-class, .hljs-selector-id, .hljs-selector-attr, .hljs-selector-pseudo { color: var(--syn-type); }
  .hljs-regexp, .hljs-symbol, .hljs-char.escape_ { color: var(--syn-regex); }
  .hljs-section { font-weight: 600; }
  .hljs-bullet { color: var(--syn-number); }
  .hljs-link { color: var(--syn-builtin); text-decoration: underline; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 600; }
  .hljs-deletion { color: var(--syn-self); }
  .hljs-subst { color: var(--text); }
  .hljs-code { color: var(--syn-string); }
  .hljs-formula { color: var(--syn-builtin); }

  /* ===== debug HUD ===== */
  #hud {
    display: none; position: absolute; left: 20px; bottom: 18px; z-index: 9;
    font-family: 'Inter', system-ui, sans-serif; font-size: 12px; color: #53FC18;
    background: rgba(0, 0, 0, .65); padding: 4px 8px; border-radius: 6px; white-space: pre;
  }
  body.debug #hud { display: block; }

  #probe { position: absolute; left: -9999px; top: 0; visibility: hidden; white-space: pre; font-family: var(--mono); font-size: var(--size); font-weight: 400; }

  /* ===== gallery / control panel (?gallery) ===== */
  body.gallery { background: #0f1014; overflow: auto; font-family: 'Inter', system-ui, sans-serif; color: #e6e6ea; }
  body.gallery #stage, body.gallery #panel, body.gallery #hud { display: none; }
  #gal { padding: 22px 24px 48px; max-width: 1480px; margin: 0 auto; }
  #gal h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  #gal .sub { color: #8b8d98; font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
  #gal .sub code { color: #c9cbd6; background: #1b1c23; padding: 1px 6px; border-radius: 5px; font-family: var(--mono); font-size: 12px; }
  #gal .top { display: flex; gap: 18px; align-items: stretch; flex-wrap: wrap; margin-bottom: 20px; }
  #gal .controls { flex: 1 1 560px; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px; background: #16171d; border: 1px solid rgba(255, 255, 255, .08); border-radius: 12px; font-size: 13px; }
  #gal .controls .row { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  #gal .sliders { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px 18px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .08); align-items: center; }
  #gal .controls .sliders label { display: grid; grid-template-columns: 82px 1fr 48px; align-items: center; gap: 8px; cursor: default; white-space: nowrap; }
  #gal .controls .sliders label.chk { display: flex; gap: 7px; cursor: pointer; }
  #gal .controls .sliders label.pick { grid-template-columns: 82px 1fr; }
  #gal .controls select { background: #0f1014; color: #fff; border: 1px solid rgba(255, 255, 255, .12); border-radius: 6px; padding: 4px 6px; font: inherit; }
  #gal .sliders input[type=range] { width: 100%; accent-color: #53FC18; }
  #gal .sliders output { text-align: right; color: #c9cbd6; font-variant-numeric: tabular-nums; font-size: 12px; }
  #gal .preview { flex: 0 0 480px; height: 270px; position: relative; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .08); background: linear-gradient(135deg, #3a5a40 0%, #6b7f8f 45%, #b89a63 100%); }
  #gal .preview iframe { width: 960px; height: 540px; border: 0; transform: scale(.5); transform-origin: 0 0; pointer-events: none; background: transparent; }
  #gal .preview span { position: absolute; left: 10px; top: 8px; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; background: rgba(0, 0, 0, .45); padding: 2px 7px; border-radius: 999px; }
  #gal .controls label { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  #gal .controls input[type=checkbox] { width: 16px; height: 16px; accent-color: #53FC18; }
  #gal .controls input[type=number] { width: 66px; background: #0f1014; color: #fff; border: 1px solid rgba(255, 255, 255, .12); border-radius: 6px; padding: 4px 6px; font: inherit; }
  #gal .controls button { background: #262833; color: #fff; border: 1px solid rgba(255, 255, 255, .12); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #gal .controls button:hover { background: #30323f; }
  #gal .controls .status { margin-left: auto; color: #8b8d98; }
  #gal .controls .status b { color: #53FC18; font-weight: 600; }
  #gal .controls.offline label, #gal .controls.offline button { opacity: .4; pointer-events: none; }

    dirtyEl.classList.toggle('on', !!s.dirty && !s.hidden);
    const lang = s.language || '';
    if (langEl.textContent !== lang) { langEl.textContent = lang; setAccent(lang); }
    posEl.textContent = s.cursor ? `Ln ${s.cursor.line + 1}, Col ${s.cursor.ch + 1}` : '';
    dot.classList.toggle('demo', !!s.demo);
  }

  function addRect(x, y, w, h) {
    const d = document.createElement('div');
    d.className = 'sel';
    d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.width = w + 'px'; d.style.height = h + 'px';
    selLayer.appendChild(d);
  }

  function renderSelection(s, first, tab, toLocal) {
    selLayer.textContent = '';
    const sel = s.selection;
    if (!sel) return;
    const last = first + s.lines.length - 1;
    for (let n = Math.max(sel.start.line, first); n <= Math.min(sel.end.line, last); n++) {
      const text = s.lines[n - first];
      const rec = lineEls.get(n);
      if (!rec) continue;
      const o0 = n === sel.start.line ? domOffset(text, sel.start.ch, tab) : 0;
      const o1 = n === sel.end.line ? domOffset(text, sel.end.ch, tab) : expandTabs(text, tab).length;
      const rects = rangeRects(rec.el, o0, o1);
      let drew = false;
      for (let i = 0; i < rects.length; i++) {
        const r = rects[i];
        if (r.right - r.left <= 0) continue;
        const a = toLocal(r.left, r.top), b = toLocal(r.right, r.top + r.height);
        const extend = (n < sel.end.line && i === rects.length - 1) ? charW * 0.6 : 0; // like the editor: run past the line end
        addRect(a.x, a.y, b.x - a.x + extend, b.y - a.y);
        drew = true;
      }
      if (!drew) { // empty line inside the selection: a sliver so the line still reads as selected
        const r = caretRect(rec.el, o0);
        const p = r ? toLocal(r.left, r.top) : { x: LINE_PAD, y: rec.top };
        addRect(p.x, p.y, charW * 0.6, lh);
      }
    }
  }

  function restartBlink() {
    caret.style.animation = 'none';
    void caret.offsetWidth; // reflow so the animation restarts
    caret.style.animation = '';
  }

  function render() {
    const s = state;
    if (!s || galleryMode) return;
    applyLook(effectiveLook(s));
    if (s.paused || s.empty) { panel.classList.add('hidden'); zoomReset(false); return; }
    panel.classList.remove('hidden');
    renderHeader(s);
    if (s.hidden) { view.classList.add('locked'); currentHl = null; zoomReset(true); return; }
    view.classList.remove('locked');
    if (!Array.isArray(s.lines) || !s.cursor) return;

    const first = s.start | 0, count = s.lines.length, last = first + count - 1;
    const zt = zoomTarget(s, first, last);  // where the zoom points; null when zoom is off or idle
    const focusLine = zt && zt.src === 'mouse' ? zt.line : (s.focus | 0); // zoomed on the mouse: centre on its line
    const key = (s.dir || '') + '/' + (s.file || '');
    let snap = key !== curFile || prevFirst < 0 || Math.abs(focusLine - prevFocus) > BIG_JUMP;
    if (key !== curFile) { anchor = 0; prevFirst = -1; }
    curFile = key;

    const tab = s.tabSize || 4;
    const texts = s.lines.map((t) => expandTabs(t, tab));
    const hl = resolveLanguage(s.language);
    currentHl = hl;
    let htmls = null;
    if (hl) {
      try { htmls = splitLines(hljs.highlight(texts.join('\n'), { language: hl, ignoreIllegals: true }).value); }
      catch (e) { dlog('highlight failed', e); htmls = null; }
    }
    if (!htmls || htmls.length !== count) htmls = texts.map(esc);

    // 1. line elements, diffed by line number so untouched lines keep their DOM (no flicker)
    for (const [n, rec] of lineEls) {
      if (n >= first && n <= last) continue;
      if (n < first && prevFirst >= 0) anchor += rec.h - lh; // a wrapped line slid out above: its extra rows stay accounted for
      rec.el.remove();
      lineEls.delete(n);
    }
    for (const [n, rec] of numEls) if (n < first || n > last) { rec.el.remove(); numEls.delete(n); }
    for (let i = 0; i < count; i++) {
      const n = first + i, html = htmls[i];
      let rec = lineEls.get(n);
      if (!rec) {
        const el = document.createElement('div');
        el.className = 'line';
        lineLayer.appendChild(el);
        rec = { el, html: null, top: -1, h: 0, fresh: true };
        lineEls.set(n, rec);
      }
      if (rec.html !== html) { rec.el.innerHTML = html; rec.html = html; }
      let ne = numEls.get(n);
      if (!ne) {
        const el = document.createElement('div');
        el.className = 'ln';
        el.textContent = n + 1;
        gutterLayer.appendChild(el);
        ne = { el, top: -1 };
        numEls.set(n, ne);
      }
      ne.el.classList.toggle('active', n === s.cursor.line);
    }
    const digits = String(Math.max(s.lineCount || 1, 1)).length;
    root.style.setProperty('--gutter-w', Math.round((digits + 1) * charW + 24) + 'px');

    // 2. heights (one layout read; wrapped lines are taller) -> tops, continuous across window moves
    const tops = new Array(count), heights = new Array(count);
    for (let i = 0; i < count; i++) {
      const rec = lineEls.get(first + i);
      const h = look.wrap ? Math.max(lh, rec.el.offsetHeight) : lh;
      if (rec.fresh) { rec.fresh = false; if (prevFirst >= 0 && first + i < prevFirst) anchor -= h - lh; } // slid in above
      rec.h = h;
      heights[i] = h;
    }
    if (first === 0 && anchor !== 0) { anchor = 0; snap = true; }
    let y = first * lh + anchor;
    for (let i = 0; i < count; i++) { tops[i] = y; y += heights[i]; }
    const bottom = y;
    for (let i = 0; i < count; i++) {
      const n = first + i, rec = lineEls.get(n), ne = numEls.get(n);
      if (rec.top !== tops[i]) { rec.el.style.top = tops[i] + 'px'; rec.top = tops[i]; }
      if (ne.top !== tops[i]) { ne.el.style.top = tops[i] + 'px'; ne.top = tops[i]; }
    }
    prevFirst = first;
    prevFocus = focusLine;
    if (snap) body.classList.add('no-anim');

    // 3. vertical position: focus line centred, never past the file's first or last line
    const viewH = view.clientHeight;
    const fi = clamp(focusLine - first, 0, count - 1);
    let ty = Math.round(viewH / 2 - heights[fi] / 2 - tops[fi]);
    // at the very top / bottom of a file, keep the first / last line clear of the edge fade
    const edgePad = Math.max(EDGE_PAD, Math.round(viewH * look.fade / 100));
    if (last >= (s.lineCount | 0) - 1) ty = Math.max(ty, viewH - bottom - edgePad);
    if (first === 0) ty = Math.min(ty, edgePad);

    // 4. caret, current line, selection - measured from the DOM so wrapping and wide glyphs land exactly
    const cl = s.cursor.line, ci = cl - first;
    const caretOk = ci >= 0 && ci < count;
    const toLocal = screenToLocal();
    let caretX = LINE_PAD, caretY = 0;
    if (caretOk) {
      const r = caretRect(lineEls.get(cl).el, domOffset(s.lines[ci], s.cursor.ch, tab));
      if (r) { const p = toLocal(r.left, r.top); caretX = p.x; caretY = p.y; }
      else { caretX = LINE_PAD; caretY = tops[ci]; }
      for (const c of curlines) { c.style.top = tops[ci] + 'px'; c.style.height = heights[ci] + 'px'; }
    }
    caret.style.display = caretOk ? '' : 'none';
    caret.style.left = Math.round(caretX) + 'px';
    caret.style.top = Math.round(caretY) + 'px';
    restartBlink();
    renderSelection(s, first, tab, toLocal);
    // the zoom target, measured now (the same moment as toLocal), positioned after the new transforms below
    let zLocal = null;
    if (zt) {
      const zi = zt.line - first, zrec = lineEls.get(zt.line);
      if (zrec && zi >= 0 && zi < count) {
        const r = caretRect(zrec.el, domOffset(s.lines[zi], zt.ch, tab));
        zLocal = r ? toLocal(r.left, r.top + r.height / 2) : { x: LINE_PAD, y: tops[zi] + lh / 2 };
      }
    }

    // 5. with wrap off: slide long lines sideways so the caret stays in view
    let tx = 0;
    if (!look.wrap && look.follow && caretOk) {
      const limit = code.clientWidth - 56 - Math.max(charW * 6, 60);
      if (caretX > limit) tx = -(caretX - limit);
    }
    codeLayer.style.transform = `translate(${tx}px, ${ty}px)`;
    gutterLayer.style.transform = `translateY(${ty}px)`;

    // 6. zoom: camera or lens on the target
    renderZoom(zt, zLocal, tx, ty);

    if (snap) requestAnimationFrame(() => requestAnimationFrame(() => body.classList.remove('no-anim')));
  }

  function hud() {
    if (!debug) return;
    const s = state || {};
    hudEl.textContent = `${connected ? 'connected' : 'disconnected'}  ${serverBase}\n` +
      `${updates} updates (last: ${s.reason || '-'}) · ${lastBytes} B · ${s.language || '-'} → ${currentHl || 'plain'} · ` +
      `theme ${look ? look.theme : '-'} · ${charW.toFixed(2)}px/char · ${lh}px/line · wrap ${look && look.wrap ? 'on' : 'off'}` +
      (look && look.zoom !== 'off'
        ? `\nzoom ${look.zoom} ×${look.zoomAmt} follows ${look.zoomFollow} → ${lastMover}${zoomActive ? '' : ' (idle, zoomed out)'}` +
          `${s.mouse ? ` · mouse Ln ${s.mouse.line + 1}, Col ${s.mouse.ch + 1}` : ' · no mouse yet'}`
        : '');
  }

  function setConnected(v) {
    connected = v;
    dot.classList.toggle('off', !v);
    hud();
  }

  // ---- data: Server-Sent Events from the extension ----
  function connect(onState) {
    dlog('connecting to', serverBase + '/events');
    const es = new EventSource(serverBase + '/events');
    es.onopen = () => { dlog('connected'); setConnected(true); };
    es.onerror = () => { setConnected(false); };        // EventSource reconnects on its own
    es.onmessage = (ev) => {
      try {
        lastBytes = ev.data.length;
        updates++;
        const prev = state;
        state = JSON.parse(ev.data);
        noteActivity(state, prev);
        if (onState) onState(state); else render();
        hud();
        if (params.has('shot')) es.close(); // one frame for a headless screenshot: don't hold the stream open
      } catch (e) { dlog('bad payload', e); }
    };
  }

  // ---- demo: canned Lua that types itself, so the source can be positioned in OBS without VS Code ----
  function runDemo() {
    const src = [
      'Config.Pumpkins = {',
      '    -- where the pumpkin props are planted around the farm',
      '    Spots = {',
      '        { coords = vector3(-357.91, -137.17, 38.49), item = "pumpkin", prop = "prop_veg_crop_03_pump" },',
      '        { coords = vector3(-581.94, -1070.52, 21.33), item = "pumpkin", prop = "prop_veg_crop_03_pump" },',
      '        { coords = vector3(-690.67, 315.36, 82.11), item = "pumpkin", prop = "prop_veg_crop_03_pump" },',
      '        { coords = vector3(419.43, -983.58, 28.42), item = "pumpkin", prop = "prop_veg_crop_03_pump" },',
      '    },',
      '',
      '    -- animation played while picking',
      '    PickAnimation = {',
      "        dict = 'amb@world_human_gardener_plant@male@base',",
      "        anim = 'base',",
      '        flag = 1,',
      '    },',
      '',
      '    -- skill checks in order; failing any one fails the pick',
      "    SkillCheck = { 'easy', 'medium' },",
      '',
      "    SuccessMessage = 'You picked a pumpkin!',",
      "    FailureMessage = 'You failed to pick the pumpkin!',",
      '}',
      '',
      'local function canPick(src)',
      '    local player = exports.qbx_core:GetPlayer(src)',
      '    if not player then return false end',
      '    return player.Functions.GetItemByName("basket") ~= nil',
      'end',
    ];
    const typed = "    Cooldown = 30, -- seconds between picks";
    const insertAt = 14;
    const base = { v: 1, demo: true, file: 'pumpkins.lua', dir: 'resources/[qbx]/qbx_farming/config', language: 'lua', tabSize: 4 };
    // spots the simulated mouse rests on (after the typed line is in): the dict string, SkillCheck, canPick
    const points = [{ line: 11, ch: 22 }, { line: 18, ch: 9 }, { line: 24, ch: 17 }];
    const T = insertAt + typed.length; // the step where typing ends
    let lines = src.slice(), step = params.has('still') ? T + 1 : 0;
    setConnected(true);
    const show = (cursor, selection, mouse) => {
      const prev = state;
      state = Object.assign({}, base, {
        lineCount: lines.length, cursor, selection: selection || null, focus: cursor.line, start: 0, lines,
        dirty: lines.length !== src.length, mouse: mouse || (prev && prev.mouse) || null,
      });
      noteActivity(state, prev);
      render();
      hud();
    };
    if (params.has('still')) { // one static frame, for the gallery tiles and screenshots (mouse resting on the dict string)
      lines.splice(insertAt, 0, typed);
      show({ line: insertAt, ch: typed.length }, { start: { line: 10, ch: 4 }, end: { line: 10, ch: 17 } }, { line: 11, ch: 22, t: 1 });
      return;
    }
    const tick = () => {
      let delay = 320;
      if (step < insertAt) {                               // walk the cursor down
        show({ line: step, ch: Math.min(lines[step].length, 8) });
      } else if (step === insertAt) {                      // open a new line
        lines = src.slice(); lines.splice(insertAt, 0, '');
        show({ line: insertAt, ch: 0 });
      } else if (step <= insertAt + typed.length) {        // type it out
        const n = step - insertAt;
        lines[insertAt] = typed.slice(0, n);
        show({ line: insertAt, ch: n });
        delay = 55 + Math.random() * 60;
      } else if (step <= T + 4) {                          // select the new line for a moment
        show({ line: insertAt, ch: typed.length }, { start: { line: insertAt, ch: 4 }, end: { line: insertAt, ch: typed.length } });
        delay = 500;
      } else if (step <= T + 4 + points.length) {          // point at things with the mouse (the zoom follows it)
        const p = points[step - (T + 5)];
        show({ line: insertAt, ch: typed.length }, null, { line: p.line, ch: p.ch, t: Date.now() });
        delay = 1600;
      } else if (step <= T + 4 + points.length + 14) {     // wander down to the function with the text cursor
        const l = Math.min(lines.length - 1, insertAt + (step - (T + 4 + points.length)));
        show({ line: l, ch: Math.min(lines[l].length, 10) });
      } else { step = -1; lines = src.slice(); delay = 800; }
      step++;
      setTimeout(tick, delay);
    };
    tick();
  }

  // ---- gallery / control panel: every theme side by side; clicks write the VS Code settings ----
  function runGallery() {
    body.classList.add('gallery');
    const live = /^https?:$/.test(location.protocol);
    const page = location.pathname;
    const gal = document.createElement('div');
    gal.id = 'gal';
    gal.innerHTML = `
      <h1>Stream Code · themes &amp; options</h1>
      <div class="sub">${live
        ? 'Click a theme to use it. Everything here writes the <b>Stream Code</b> settings in VS Code, so the OBS source changes right away. URL options on a source (<code>?theme=kick</code>, <code>?clean</code>…) still override these for that source.'
        : 'Opened as a file, so nothing can be applied from here: click a theme to copy its URL option, or set the theme in VS Code settings → Stream Code.'}</div>
      <div class="top">
        <div class="controls${live ? '' : ' offline'}">
          <div class="row">
            <label><input type="checkbox" data-k="header"> Header</label>
            <label><input type="checkbox" data-k="bg"> Background</label>
            <label><input type="checkbox" data-k="nums"> Line numbers</label>
            <label><input type="checkbox" data-k="wrap"> Word wrap</label>
            <label>Font size <input type="number" data-k="size" min="8" max="80" step="1"></label>
            <label>Line height <input type="number" data-k="lh" min="1" max="3" step="0.1"></label>
            <button data-reset>Reset to the theme's defaults</button>
            <span class="status">${live ? 'connecting…' : 'offline'}</span>
          </div>
          <div class="sliders">
            <label>Tilt X <input type="range" data-k="tiltx" min="-60" max="60" step="1"><output></output></label>
            <label>Turn Y <input type="range" data-k="tilty" min="-60" max="60" step="1"><output></output></label>
            <label>Rotate <input type="range" data-k="rot" min="-45" max="45" step="1"><output></output></label>
            <label>Perspective <input type="range" data-k="persp" min="200" max="3000" step="50"><output></output></label>
            <label>Scale <input type="range" data-k="scale" min="0.25" max="2" step="0.05"><output></output></label>
            <label>Depth <input type="range" data-k="depth" min="0" max="40" step="1"><output></output></label>
            <label>Opacity <input type="range" data-k="opacity" min="0.1" max="1" step="0.05"><output></output></label>
            <label>Edge fade <input type="range" data-k="fade" min="0" max="45" step="1" data-unit="%" data-zero="off"><output></output></label>
            <label class="chk"><input type="checkbox" data-k="float"> Float (slow hover)</label>
            <button data-reset3d>Reset 3D</button>
          </div>
          <div class="sliders">
            <label class="pick">Zoom <select data-k="zoom"><option value="off">Off</option><option value="camera">Camera</option><option value="lens">Lens</option></select></label>
            <label class="pick">Follows <select data-k="zoomFollow"><option value="both">Mouse + text cursor</option><option value="mouse">Mouse</option><option value="cursor">Text cursor</option></select></label>
            <label>Amount <input type="range" data-k="zoomAmt" min="1.1" max="4" step="0.1" data-unit="×"><output></output></label>
            <label>Zoom out <input type="range" data-k="zoomIdle" min="0" max="30" step="1" data-unit=" s" data-zero="never"><output></output></label>
            <button data-resetzoom>Reset zoom</button>
          </div>
        </div>
        ${live ? '<div class="preview"><iframe src="' + page + (params.has('shot') ? '?shot&still' : '') + '"></iframe><span>live · half size</span></div>' : ''}
      </div>
      <div class="grid"></div>
      <div class="toast"></div>`;
    body.appendChild(gal);
    const grid = gal.querySelector('.grid'), toast = gal.querySelector('.toast'), status = gal.querySelector('.status');
    const inputs = Array.from(gal.querySelectorAll('[data-k]'));
    let toastTimer = null;
    const say = (msg, err) => {
      toast.textContent = msg; toast.classList.toggle('err', !!err); toast.classList.add('on');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('on'), 2200);
    };
    const post = (patch) => fetch(serverBase + '/look', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) })
      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); say('Applied'); })
      .catch((e) => say('Could not apply (' + e.message + '). Reload the VS Code window so it runs the current extension build.', true));

    for (const [name, T] of Object.entries(THEMES)) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.theme = name;
      tile.innerHTML = `<iframe loading="lazy" src="${page}?demo&still&theme=${name}&size=13&lh=1.5"></iframe>
        <div class="cap"><b>${T.label}</b><span>${T.about}</span><code>?theme=${name}</code></div>`;
      tile.addEventListener('click', () => {
        if (live) post({ theme: name });
        else if (navigator.clipboard) navigator.clipboard.writeText('?theme=' + name).then(() => say('Copied ?theme=' + name)).catch(() => say('?theme=' + name));
        else say('?theme=' + name);
      });
      grid.appendChild(tile);
    }
    const readout = (inp) => {
      const out = inp.type === 'range' ? inp.parentElement.querySelector('output') : null;
      if (out) out.value = inp.dataset.zero && Number(inp.value) === 0 ? inp.dataset.zero : inp.value + (inp.dataset.unit || '');
    };
    for (const inp of inputs) {
      inp.addEventListener('input', () => readout(inp));
      inp.addEventListener('change', () => {
        const k = inp.dataset.k;
        let v;
        if (inp.type === 'checkbox') v = inp.checked;
        else if (inp.tagName === 'SELECT') v = inp.value;
        else { v = parseFloat(inp.value); if (!Number.isFinite(v)) return; }
        post({ [k]: v });
      });
    }
    gal.querySelector('[data-resetzoom]').addEventListener('click', () => post({ zoom: null, zoomFollow: null, zoomAmt: null, zoomIdle: null }));
    gal.querySelector('[data-reset]').addEventListener('click', () => post({ header: null, bg: null, nums: null, wrap: null, size: null, lh: null, fade: null }));
    gal.querySelector('[data-reset3d]').addEventListener('click', () => post({ tiltx: null, tilty: null, rot: null, persp: null, scale: null, depth: null, float: null, opacity: null }));

    const reflect = (s) => {
      const eff = effectiveLook(s);
      for (const t of grid.children) t.classList.toggle('active', t.dataset.theme === eff.theme);
      for (const inp of inputs) {
        const k = inp.dataset.k;
        if (inp.type === 'checkbox') inp.checked = !!eff[k];
        else { inp.value = eff[k]; readout(inp); }
      }
      status.innerHTML = `live · theme <b>${eff.theme}</b>${s.file ? ' · ' + esc(s.file) : ''}`;
    };
    if (live) connect(reflect);
  }

  // ---- go ----
  window.addEventListener('resize', () => { cam = null; lensBox = null; measure(); render(); });
  if (document.fonts) {
    // fonts arrive after the first paint (and change with the theme): re-measure so wrapped
    // line heights and the caret match the real glyphs
    if (document.fonts.ready) document.fonts.ready.then(() => { measure(); render(); });
    document.fonts.addEventListener('loadingdone', () => { measure(); render(); });
  }
  if (params.has('gallery')) { runGallery(); return; }
  applyLook(effectiveLook(null));
  if (params.has('demo')) runDemo(); else connect();
  hud();
})();
</script>
</body>
</html>
